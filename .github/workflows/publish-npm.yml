name: Publish npm

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    environment: npm-release
    if: github.repository == 'taehwandev/VibeGuard'
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      HAS_FIRST_PUBLISH_TOKEN: ${{ secrets.NPM_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify dependency policy
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const dependencies = [
            ...Object.keys(pkg.dependencies ?? {}),
            ...Object.keys(pkg.devDependencies ?? {}),
            ...Object.keys(pkg.optionalDependencies ?? {})
          ];

          if (dependencies.length > 0 && !fs.existsSync("package-lock.json")) {
            console.error("Release builds with dependencies require package-lock.json.");
            process.exit(1);
          }
          NODE

      - name: Verify release tag matches package version
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const expected = `v${pkg.version}`;
          const actual = process.env.RELEASE_TAG;

          if (actual !== expected) {
            console.error(`Release tag ${actual} does not match package version ${expected}.`);
            process.exit(1);
          }
          NODE

      - name: Run tests
        run: npm test

      - name: Run VibeGuard strict audit
        run: node src/cli.js audit . --strict

      - name: Check package contents
        run: npm pack --dry-run

      - name: Publish to npm with first-publish token
        if: env.HAS_FIRST_PUBLISH_TOKEN == 'true'
        run: npm publish --provenance --access public
        env:
          # Temporary environment secret for the first publish only. After
          # `npm trust github` is configured, remove this secret and publish
          # through GitHub Actions OIDC without a long-lived npm token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm with trusted publishing
        if: env.HAS_FIRST_PUBLISH_TOKEN != 'true'
        run: npm publish --provenance --access public
